<script>
$(function (){
	$.wdImageView({});
	new WOW().init();
	
	$(document).on('click','.menu-right',function(){
		$(this).find('span').toggleClass('on');
		$('.menu-box').toggleClass('on');
		$('.main-bg').toggle();
	});
	$(document).on('click','.main-bg',function(){
		$('.menu-right').find('span').removeClass('on');
		$('.menu-box').removeClass('on');
		$('.main-bg').hide();
	});
	$(document).on('click','.subnav',function(){
		$('.menu-box').removeClass('on');
		$('.menu-right').hide();
		$(this).siblings('.menu-text').addClass('on');
	});
	$(document).on('click','.menu_back',function(){
		$('.menu-text').removeClass('on');
		$('.menu-right').show();
		$('.menu-box').addClass('on');
	});
})
</script><script>
var _listno;
var _page=1;
$(function(){
	$('.pro_load').on('click',function(){
		_listno = $(this).data('listno');
		if($('body').hasClass('open')){
			$('body').removeClass('open');
		}
		$.showLoading();
		$.ajax({
			url:'pic_ajax.php@smallid='+_listno+'&page='+_page,
			success:function(data){
				$.hideLoading();
				if (data) {
					$('.pro_page').empty().append(data);
					$('body').addClass('open');
					_page++;
				}
			}
		})
	})
	$(document).on('click','.bot_more',function(){
		$.showLoading();
		$.ajax({
			url:'page_ajax.php@smallid='+_listno+'&page='+_page,
			success:function(data){
				$.hideLoading();
				if (data) {
					$('.pro_page ul').append(data);
					_page++;
				}
			}
		})
	})
})
$(document).on('click','.pro_mark,.menu_btn',function(){
		$(".ipusher").removeClass("open");
		_page=1;
})
</script>
